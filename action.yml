name: 'LLMO sign'
description: 'Re-sign your llmo.json on every push, using the official llmo CLI with your private key from a repo secret.'
author: 'LLMO project (https://llmo.org)'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  doc-path:
    description: 'Path to the llmo.json file in the repo. Hugo publishers typically use static/.well-known/llmo.json; Next.js publishers typically use public/.well-known/llmo.json.'
    required: false
    default: 'static/.well-known/llmo.json'
  key:
    description: 'PKCS#8 PEM private key. Load from a repo secret (pass secrets.LLMO_PRIVATE_KEY into this input). Generated by `llmo keygen`. Never log or echo this value.'
    required: true
  kid:
    description: 'Key ID for the signing key. MUST match the kid of the corresponding public JWK in your /.well-known/llmo-keys.json.'
    required: true
  alg:
    description: 'JWS signing algorithm. One of ES256, ES384, EdDSA. Must match the alg of the JWK identified by kid.'
    required: false
    default: 'ES256'
  cli-version:
    description: 'Pin a specific llmo CLI version (e.g. "0.1.14"). Default is the latest published version. Pinning is recommended for reproducible builds.'
    required: false
    default: 'latest'
  commit:
    description: 'Commit the re-signed document back to the branch. Set to "false" to dry-run (sign only; never commit; useful for drift detection in PRs).'
    required: false
    default: 'true'
  commit-message:
    description: 'Commit message used when committing the re-signed document. The default includes "[skip ci]" to prevent the commit from re-triggering this same workflow.'
    required: false
    default: 'chore(llmo): re-sign llmo.json [skip ci]'

outputs:
  changed:
    description: '"true" if the signed document was written and a commit was produced (or would have been, in dry-run mode); "false" if the re-sign produced no diff.'
    value: ${{ steps.sign.outputs.changed }}
  doc-path:
    description: 'The resolved doc-path that was signed (for downstream steps).'
    value: ${{ inputs.doc-path }}

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install llmo CLI
      shell: bash
      env:
        LLMO_CLI_VERSION: ${{ inputs.cli-version }}
      run: |
        set -euo pipefail
        # Suppress the bundled /llmo skill postinstall on CI runners — the
        # CI is signing, not publishing. The skill copy would write under
        # $HOME but is wasted work on a one-shot runner.
        export LLMO_SKILL_DIR="$RUNNER_TEMP/llmo-skill-dropped"
        export LLMO_ALLOW_OUT_OF_HOME=1
        npm install -g "llmo@${LLMO_CLI_VERSION}"
        llmo --version

    - name: Verify doc-path exists
      shell: bash
      env:
        LLMO_DOC_PATH: ${{ inputs.doc-path }}
      run: |
        set -euo pipefail
        if [ ! -f "$LLMO_DOC_PATH" ]; then
          echo "::error::llmo-action: doc-path '$LLMO_DOC_PATH' does not exist in the repo checkout. Set the 'doc-path' input to wherever your llmo.json lives (Hugo: static/.well-known/llmo.json, Next.js: public/.well-known/llmo.json)."
          exit 1
        fi

    - name: Sign llmo.json
      id: sign
      shell: bash
      env:
        LLMO_PRIVATE_KEY: ${{ inputs.key }}
        LLMO_KID: ${{ inputs.kid }}
        LLMO_ALG: ${{ inputs.alg }}
        LLMO_DOC_PATH: ${{ inputs.doc-path }}
      run: |
        set -euo pipefail
        keyfile=$(mktemp)
        chmod 600 "$keyfile"
        trap 'rm -f "$keyfile"' EXIT
        # Write the PEM via a heredoc-free path that never echoes the value.
        printf '%s' "$LLMO_PRIVATE_KEY" > "$keyfile"
        # Run the CLI; --in-place overwrites $LLMO_DOC_PATH with the
        # signed output. The CLI canonicalizes (JCS) the unsigned
        # payload before signing per §4.3.1.
        llmo sign \
          --key "$keyfile" \
          --kid "$LLMO_KID" \
          --alg "$LLMO_ALG" \
          --in-place \
          "$LLMO_DOC_PATH"
        if git diff --quiet -- "$LLMO_DOC_PATH"; then
          echo "llmo-action: re-sign produced no diff; nothing to commit"
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          echo "llmo-action: re-sign produced a diff; will commit if commit=true"
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Commit and push
      if: ${{ inputs.commit == 'true' && steps.sign.outputs.changed == 'true' }}
      shell: bash
      env:
        LLMO_DOC_PATH: ${{ inputs.doc-path }}
        LLMO_COMMIT_MESSAGE: ${{ inputs.commit-message }}
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -- "$LLMO_DOC_PATH"
        git commit -m "$LLMO_COMMIT_MESSAGE"
        git push
